services:
  - type: web
    name: placement-ai-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: 'sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"'
    healthCheckPath: /health
    envVars:
      # Secret values -> fill these in the Render Dashboard during
      # blueprint creation (or via Render environment groups).
      # NEVER hardcode secret values in this file.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Non-secret defaults
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
